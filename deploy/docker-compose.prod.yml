# Production add-on: HTTPS in front of everything, nothing but 80/443 exposed.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# Needs (see deploy/.env.production.example): DOMAIN, ACME_EMAIL, APP_URL=https://<DOMAIN>, real SMTP_* values.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep this volume, or certificates are re-issued (and rate limited)
      - caddy_config:/config

  # The web container is no longer reachable from outside; only Caddy talks to it.
  web:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: !reset []
    build:
      context: ./frontend
      args:
        SITE_URL: https://${DOMAIN}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
        INDEXNOW_KEY: ${INDEXNOW_KEY:-}

  api:
    restart: unless-stopped
    # Runs as the image's non-root user (backend/Dockerfile: USER $APP_UID) on port 8080, so it needs no Linux capabilities at all,
    # and nothing in it may gain privileges later (setuid binaries, etc.).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      App__WebBaseUrl: https://${DOMAIN}
      Cors__Origins__0: https://${DOMAIN}
      Seed__Demo: "false"          # never ship the demo organization with its well-known password
      Webhooks__AllowPrivateTargets: "false"

  db:
    restart: unless-stopped
    ports: !reset []               # the database is reachable only from other containers

  backup:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
