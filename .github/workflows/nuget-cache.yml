# Dev helper on its own branch: restores the backend with the .NET 10 SDK and keeps the package folder as an artifact.
name: NuGet cache (dev)
on:
  push:
    branches: [nuget-cache]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx
      - run: dotnet restore backend/ProjectManagement.sln
      # The .NET 9 reference packs: the runner has them installed, a plain .NET 10 SDK downloads them.
      - run: |
          mkdir -p /tmp/packs && cd /tmp/packs
          cat > packs.csproj <<'X'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup>
          <PackageDownload Include="Microsoft.AspNetCore.App.Ref" Version="[9.0.20]" />
          <PackageDownload Include="Microsoft.NETCore.App.Ref" Version="[9.0.20]" />
          <PackageDownload Include="Microsoft.NETCore.App.Host.linux-x64" Version="[9.0.20]" />
          </ItemGroup></Project>
          X
          dotnet restore packs.csproj
      - run: tar -C ~/.nuget -czf nuget-packages.tgz packages
      # A draft release (never public), replaced on each run; deleted when no longer needed.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nuget-cache-dev --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          split -b 1900m nuget-packages.tgz nuget-packages.tgz.part-
          gh release create nuget-cache-dev --draft --title "NuGet cache (dev, temporary)" --notes "Temporary dev helper; safe to delete." -R "$GITHUB_REPOSITORY" nuget-packages.tgz.part-*
