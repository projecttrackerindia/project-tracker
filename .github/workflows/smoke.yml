name: Browser smoke test

# Seeded live-API browser journeys for the current UI. Failures are visible as failures; no continue-on-error.
# PRs changing these journeys validate them before merge; main and manual runs remain supported.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/e2e/**'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [navigation, documents, security]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API (Development, seeded demo data)
        working-directory: backend/src/ProjectManagement.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
          # The journeys sign up @example.com people; example.com publishes a null MX, so the real mail-domain check would refuse them.
          Signup__CheckEmailDomain: 'false'
        run: |
          dotnet build -c Release -v q
          nohup dotnet bin/Release/net9.0/ProjectManagement.Api.dll > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:5080/health && break; sleep 2; done
      - name: Start the web app
        working-directory: frontend
        run: |
          npm ci
          nohup npx vite --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173/ && break; sleep 2; done
      - name: Smoke test
        working-directory: frontend
        env:
          SHOTS: ${{ runner.temp }}/smoke-shots
        run: |
          npm i --no-save playwright-core
          npx playwright-core install chromium
          # Each script runs on its own; a failure is reported as an annotation with the script's last lines (job logs are not always
          # readable from outside), and the rest still run.
          case '${{ matrix.group }}' in
            navigation) scripts='smoke invitations public mobile' ;;
            documents) scripts='documents documents-api documents-pdf' ;;
            security) scripts='documents-review documents-secrets' ;;
          esac
          failed=0
          for s in $scripts; do
            if ! node "e2e/$s.mjs" > "$RUNNER_TEMP/$s.log" 2>&1; then
              failed=1
              detail=$( (grep -E "^FAIL|Error:|waiting for|at .*e2e/" "$RUNNER_TEMP/$s.log" | head -n 14; echo ---; tail -n 4 "$RUNNER_TEMP/$s.log") | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error title=Smoke test e2e/$s.mjs failed::$detail"
              echo "::group::e2e/$s.mjs full output"; tail -n 80 "$RUNNER_TEMP/$s.log"; echo "::endgroup::"
            fi
            tail -n 5 "$RUNNER_TEMP/$s.log"
          done
          if [ "$failed" = 1 ]; then
            api=$(grep -iE "fail|error|exception" "$RUNNER_TEMP/api.log" | tail -n 8 | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            [ -n "$api" ] && echo "::warning title=API log around the failure::$api"
          fi
          exit $failed
      - name: Logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/vite.log" || true


      - name: Keep seeded browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-browser-smoke-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/smoke-shots/
            ${{ runner.temp }}/smoke.log
            ${{ runner.temp }}/invitations.log
            ${{ runner.temp }}/public.log
            ${{ runner.temp }}/mobile.log
            ${{ runner.temp }}/documents.log
            ${{ runner.temp }}/documents-api.log
            ${{ runner.temp }}/documents-review.log
            ${{ runner.temp }}/documents-secrets.log
            ${{ runner.temp }}/documents-pdf.log
          if-no-files-found: ignore
