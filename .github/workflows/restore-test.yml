name: Restore test

# Monthly: checks the Cloud SQL backup settings, restores the newest backup into a temporary instance, counts rows in the key
# tables and deletes the temporary instance (deploy/gcp/backups-verify.sh, deploy/gcp/restore-test.sh). Alerts on failure.
# Runs as its own account (GCP_RESTORE_SA, see docs/ops.md › Backups); does nothing until that variable is set.
on:
  schedule:
    - cron: "17 22 1 * *"     # 1st of each month, 03:47 IST
  workflow_dispatch:

concurrency:
  group: restore-test
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  restore:
    if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_RESTORE_SA != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RESTORE_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Backup settings
        env: { PROJECT_ID: "${{ vars.GCP_PROJECT_ID }}" }
        run: ./deploy/gcp/backups-verify.sh
      - name: Restore into a temporary instance and count rows
        if: always()
        env: { PROJECT_ID: "${{ vars.GCP_PROJECT_ID }}" }
        run: |
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client >/dev/null
          ./deploy/gcp/restore-test.sh | tee "$GITHUB_STEP_SUMMARY"
      - name: Alert
        if: failure()
        env:
          ALERT_RESEND_API_KEY: ${{ secrets.ALERT_RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_WHATSAPP_TOKEN: ${{ secrets.ALERT_WHATSAPP_TOKEN }}
          ALERT_WHATSAPP_PHONE_ID: ${{ vars.ALERT_WHATSAPP_PHONE_ID }}
          ALERT_WHATSAPP_TO: ${{ vars.ALERT_WHATSAPP_TO }}
          ALERT_WHATSAPP_TEMPLATE: ${{ vars.ALERT_WHATSAPP_TEMPLATE }}
        run: bash deploy/ops/send-alert.sh "ProjectTracker backup restore test FAILED" "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
