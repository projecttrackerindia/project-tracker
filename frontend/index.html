<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='3' y1='2' x2='29' y2='30'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='.55' stop-color='%23c084fc'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7.3 16.7l5.3 5.3L18.7 13.3' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M18.7 13.3l4.3-4.8' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='24.4' cy='7.6' r='2.8' fill='white'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Projects" />
    <meta name="description" content="Projects, tasks, operational work, time and team chat in one workspace." />
    <title>Project Tracker</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash. Light is the default: it is only dark when the person chose dark.
      try {
        var t = localStorage.getItem('pm_theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131c2a');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
