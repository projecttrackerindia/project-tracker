<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--site:head-->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Projects" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash. Light is the default: it is only dark when the person chose dark.
      try {
        var t = localStorage.getItem('pm_theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131c2a');
      } catch (e) {}
      // The home address shows the public landing page to someone who is not signed in, and the app to everyone else. A person who has
      // signed in on this device goes straight to the app; the app itself settles it for anyone else (see stores/auth.ts).
      try {
        var home = location.pathname === '/';
        var known = localStorage.getItem('pm_hint') === '1';
        document.documentElement.className = home && !known ? 'landing' : 'app';
      } catch (e) { document.documentElement.className = 'app'; }
    </script>
    <style>html.app #site{display:none}html.landing #root{display:none}html.landing,html.landing body{background:#faf9ff}</style>
    <style><!--site:css--></style>
  </head>
  <body>
    <div id="site"><!--site:body--></div>
    <div id="root"></div>
    <!--site:scripts-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
