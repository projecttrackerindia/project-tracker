    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash. Light is the default: it is only dark when the person chose dark.
      try {
        var t = localStorage.getItem('pm_theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131c2a');
      } catch (e) {}
      // The home address shows the public landing page to someone who is not signed in, and the app to everyone else. A person who has
      // signed in on this device goes straight to the app; the app itself settles it for anyone else (see stores/auth.ts).
      try {
        var home = location.pathname === '/';
        var known = localStorage.getItem('pm_hint') === '1';
        var inApp = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        document.documentElement.className = home && !known && !inApp ? 'landing' : 'app';
        // An installed app behaves like an app: no pinch or double-tap zoom, no page bounce. The website in a browser keeps normal zoom.
        if (inApp) {
          document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content');
          document.documentElement.classList.add('installed');
          ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (g) { document.addEventListener(g, function (e) { e.preventDefault(); }); });
          document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        }
      } catch (e) { document.documentElement.className = 'app'; }
      // First-visit speed: someone signed in on this device starts the session refresh now, while the app's scripts are still
      // downloading, instead of after them (the app picks this one answer up in api/client.ts; same lock, same request).
      try {
        if (document.documentElement.className === 'app' && localStorage.getItem('pm_hint') === '1' && !window.Capacitor
          && !/^\/(login|register|reset|verify|forgot|terms|privacy|status|s|connect)(\/|$)/.test(location.pathname)) {
          var go = function () { return fetch('/api/v1/auth/refresh', { method: 'POST', credentials: 'include', headers: { 'X-Requested-With': 'XMLHttpRequest' } }).catch(function () { return null; }); };
          var locks = navigator.locks;
          window.__ptRefresh = locks && locks.request ? locks.request('pt-refresh', go) : go();
          // ... and, the moment that answer is in, the two reads every signed-in page starts with (who you are and the frame's numbers),
          // so they are not waiting for the scripts either. Each answer is used once, by the same request from the app (api/client.ts).
          window.__ptEarly = window.__ptRefresh.then(function (r) {
            if (!r || !r.ok) return null;
            return r.clone().json().then(function (j) {
              var t = j && j.data && j.data.accessToken;
              if (!t) return null;
              var get = function (p) { return fetch('/api/v1' + p, { credentials: 'include', headers: { Authorization: 'Bearer ' + t } }).catch(function () { return null; }); };
              return { token: t, '/me': get('/me'), '/shell/summary': get('/shell/summary') };
            });
          }).catch(function () { return null; });
        }
      } catch (e) {}
      // Only the public screens are for search engines. Every other address (an organization's pages, a reset link, a mistyped path) is
      // answered with this same file, so it says "do not index" instead of looking like a duplicate of the home page.
      try {
        var path = location.pathname.replace(/\/$/, '') || '/';
        if ({ '/': 1, '/login': 1, '/register': 1, '/terms': 1, '/privacy': 1 }[path] === 1) {
          if (path !== '/') document.querySelector('link[rel="canonical"]').href = document.querySelector('link[rel="canonical"]').href.replace(/\/$/, '') + path;
        } else document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex, nofollow');
      } catch (e) {}
    </script>
    <style>html.installed,html.installed body{touch-action:pan-x pan-y;overscroll-behavior:none;-webkit-user-select:none;user-select:none}html.installed input,html.installed textarea,html.installed [contenteditable]{-webkit-user-select:text;user-select:text}html.installed body{overflow-x:hidden}#pt-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 16px env(safe-area-inset-bottom);background:#f3f6fb;color:#1d1d1f;font:600 15px/1.2 -apple-system,BlinkMacSystemFont,'Inter Variable','Segoe UI',Roboto,sans-serif;letter-spacing:-.01em;transition:opacity .28s cubic-bezier(.4,0,.2,1)}#pt-splash svg{filter:drop-shadow(0 10px 24px rgba(124,58,237,.28))}#pt-splash.out{opacity:0;pointer-events:none}html[data-theme=dark] #pt-splash{background:#0b0e15;color:#f5f5f7}html[data-theme=dark] #pt-splash svg{filter:drop-shadow(0 10px 28px rgba(139,108,246,.35))}@media (prefers-color-scheme:dark){html:not([data-theme]) #pt-splash{background:#0b0e15;color:#f5f5f7}}@media (prefers-reduced-motion:reduce){#pt-splash{transition:none}}html.landing #pt-splash{display:none}html.app #site{display:none}html.landing,html.landing body{background:#000}</style>

  <body>
    <!-- Shown from the first byte until the app's first screen paints, so a slow start is never a blank page: still, like a phone's launch
         screen, and it fades out into the app. The same in the browser, the installed phone app and the native apps. -->
    <div id="pt-splash" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 64 64"><defs><linearGradient id="pts-g" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8b6cf6"/><stop offset=".55" stop-color="#a27cf8"/><stop offset="1" stop-color="#b996fb"/></linearGradient><linearGradient id="pts-h" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pts-g)"/><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pts-h)"/><rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".35"/><path d="M20 34l8 8L43 24" fill="none" stroke="#fff" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44.5" cy="22.5" r="4.4" fill="#fff"/></svg>
      <span>ProjectTracker</span>
    </div>
    <script>
      // Takes the splash away (with a short fade) once the app's first screen has painted; at the latest 20 s after the page loaded, so
      // nothing can ever stay covered.
      (function () {
        var el = document.getElementById('pt-splash'), gone = false;
        window.__ptSplashDone = function () {
          if (gone || !el) return; gone = true;
          window.__ptFirstScreen = true; dispatchEvent(new Event('pt-first-screen'));
          // Two frames: the screen just committed is on the glass before the splash starts to fade.
          requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('out'); }); });
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 420);
        };
        // The first screen is there when the app has put something into #root that is not a loading state (the app's own splash or a
        // page spinner): a page, its skeleton, the sign-in page or an error. lib/splash.ts also ends it when the app says "still connecting".
        // (#root comes after this script in the page, so it is looked up when something changes.)
        var check = function () {
          var root = document.getElementById('root');
          if (gone || !root || !root.firstElementChild) return;
          if (root.querySelector('.app-splash, #root > .page-loader, main > .page-loader')) return;
          mo.disconnect(); window.__ptSplashDone();
        };
        var mo = new MutationObserver(check);
        mo.observe(document.body, { childList: true, subtree: true });
        addEventListener('load', function () { setTimeout(window.__ptSplashDone, 20000); });
      })();
    </script>
