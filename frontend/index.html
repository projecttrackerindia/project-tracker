    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash. Light is the default: it is only dark when the person chose dark.
      try {
        var t = localStorage.getItem('pm_theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131c2a');
      } catch (e) {}
      // The home address shows the public landing page to someone who is not signed in, and the app to everyone else. A person who has
      // signed in on this device goes straight to the app; the app itself settles it for anyone else (see stores/auth.ts).
      try {
        var home = location.pathname === '/';
        var known = localStorage.getItem('pm_hint') === '1';
        var inApp = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        document.documentElement.className = home && !known && !inApp ? 'landing' : 'app';
        // An installed app behaves like an app: no pinch or double-tap zoom, no page bounce. The website in a browser keeps normal zoom.
        if (inApp) {
          document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
          document.documentElement.classList.add('installed');
          ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (g) { document.addEventListener(g, function (e) { e.preventDefault(); }); });
          document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        }
      } catch (e) { document.documentElement.className = 'app'; }
      // Only the public screens are for search engines. Every other address (an organization's pages, a reset link, a mistyped path) is
      // answered with this same file, so it says "do not index" instead of looking like a duplicate of the home page.
      try {
        var path = location.pathname.replace(/\/$/, '') || '/';
        if ({ '/': 1, '/login': 1, '/register': 1, '/terms': 1, '/privacy': 1 }[path] === 1) {
          if (path !== '/') document.querySelector('link[rel="canonical"]').href = document.querySelector('link[rel="canonical"]').href.replace(/\/$/, '') + path;
        } else document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex, nofollow');
      } catch (e) {}
    </script>
    <style>html.installed,html.installed body{touch-action:pan-x pan-y;overscroll-behavior:none;-webkit-user-select:none;user-select:none}html.installed input,html.installed textarea,html.installed [contenteditable]{-webkit-user-select:text;user-select:text}html.installed body{overflow-x:hidden}#root:empty{position:fixed;inset:0;background:radial-gradient(60% 45% at 50% 40%,#f3edff,#fff 70%)}html[data-theme=dark] #root:empty{background:radial-gradient(60% 45% at 50% 40%,#1d1736,#0b0f1a 70%)}#root:empty::before{content:'';position:absolute;left:50%;top:calc(50% - 46px);width:64px;height:64px;margin-left:-32px;border-radius:18px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><path d='M5.5 12.5l4 4L14 10' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M14 10l3.2-3.6' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='18.3' cy='5.7' r='2.1' fill='%23fff'/></svg>") center/34px no-repeat,linear-gradient(135deg,#7c3aed,#a855f7 55%,#6366f1);box-shadow:0 14px 34px -12px rgba(124,58,237,.65),0 0 0 0 rgba(124,58,237,.35);animation:pt-breathe 2.2s ease-in-out infinite}#root:empty::after{content:'';position:absolute;left:50%;top:calc(50% + 34px);width:132px;height:3px;margin-left:-66px;border-radius:99px;background:linear-gradient(90deg,transparent,#7c3aed 40%,#6366f1 60%,transparent) 0 0/50% 100% no-repeat,rgba(124,58,237,.14);animation:pt-sweep 1.3s cubic-bezier(.4,0,.2,1) infinite}@keyframes pt-breathe{0%,100%{transform:scale(1);box-shadow:0 14px 34px -12px rgba(124,58,237,.65),0 0 0 0 rgba(124,58,237,.3)}50%{transform:scale(1.06);box-shadow:0 14px 34px -12px rgba(124,58,237,.65),0 0 0 14px rgba(124,58,237,0)}}@keyframes pt-sweep{from{background-position:-100% 0,0 0}to{background-position:250% 0,0 0}}@media (prefers-reduced-motion:reduce){#root:empty::before,#root:empty::after{animation:none}}html.app #site{display:none}html.landing,html.landing body{background:#000}html.landing #root:empty{background:#000}html.landing #root:empty::before,html.landing #root:empty::after{display:none}</style>
