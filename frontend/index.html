    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash. Light is the default: it is only dark when the person chose dark.
      try {
        var t = localStorage.getItem('pm_theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131c2a');
      } catch (e) {}
      // The home address shows the public landing page to someone who is not signed in, and the app to everyone else. A person who has
      // signed in on this device goes straight to the app; the app itself settles it for anyone else (see stores/auth.ts).
      try {
        var home = location.pathname === '/';
        var known = localStorage.getItem('pm_hint') === '1';
        var inApp = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        document.documentElement.className = home && !known && !inApp ? 'landing' : 'app';
        // An installed app behaves like an app: no pinch or double-tap zoom, no page bounce. The website in a browser keeps normal zoom.
        if (inApp) {
          document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
          document.documentElement.classList.add('installed');
          ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (g) { document.addEventListener(g, function (e) { e.preventDefault(); }); });
          document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        }
      } catch (e) { document.documentElement.className = 'app'; }
      // Only the public screens are for search engines. Every other address (an organization's pages, a reset link, a mistyped path) is
      // answered with this same file, so it says "do not index" instead of looking like a duplicate of the home page.
      try {
        var path = location.pathname.replace(/\/$/, '') || '/';
        if ({ '/': 1, '/login': 1, '/register': 1, '/terms': 1, '/privacy': 1 }[path] === 1) {
          if (path !== '/') document.querySelector('link[rel="canonical"]').href = document.querySelector('link[rel="canonical"]').href.replace(/\/$/, '') + path;
        } else document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex, nofollow');
      } catch (e) {}
    </script>
