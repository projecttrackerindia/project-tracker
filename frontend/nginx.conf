# The API's address. Docker Compose's own DNS resolves the plain service name "api"; a platform without that (e.g. Railway, where
# services are reached as <name>.railway.internal) overrides API_HOST at deploy time. Substituted into this file at container start
# by the nginx image's own template mechanism (this file is copied to /etc/nginx/templates/, see the Dockerfile).
# Behind an HTTPS proxy (Caddy) the visitor's scheme arrives in X-Forwarded-Proto; without one, nginx knows only its own.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API is looked up again every few seconds (a variable in proxy_pass makes nginx use the resolver at request time)
  # instead of once at startup, so redeploying the API, which gives it a new address, does not leave this proxy pointing at the old one.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
  set $api_upstream http://${API_HOST}:8080;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Same origin for UI and API keeps the HttpOnly refresh cookie first-party (SameSite=Strict).
  location /api/ {
    proxy_pass $api_upstream;
    client_max_body_size 520m;   # the API enforces the real per-plan limit
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # The AI assistant streams its answers as they are written, so nothing is buffered, deep reasoning may take a few minutes, and
  # attached pictures and documents (up to the limits the API enforces) are let through.
  location /api/v1/ai/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    client_max_body_size 40m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Live chat: a long-lived WebSocket (falls back to long polling), so no buffering and a long read timeout.
  location /hubs/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /health {
    proxy_pass $api_upstream;
  }

  # SCIM 2.0 provisioning (identity providers call {site}/scim/v2/...).
  location /scim/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Fingerprinted build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The public pages are files of their own (/features/, /pricing/, /security/): one address each, with the trailing slash.
  location ~ ^/(features|pricing|security)$ {
    return 301 /$1/;
  }

  # The brand files and the search-engine files change rarely and are fetched by crawlers: a day of caching is plenty.
  location ~ ^/(favicon\.ico|favicon\.svg|favicon-48x48\.png|og-image\.png|robots\.txt|sitemap\.xml)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Single-page app fallback. A directory with its own index.html (the public pages) is served as that page.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.html;
  }
}
