# The API's address. Docker Compose's own DNS resolves the plain service name "api"; a platform without that (e.g. Railway, where
# services are reached as <name>.railway.internal) overrides API_HOST at deploy time. Substituted into this file at container start
# by the nginx image's own template mechanism (this file is copied to /etc/nginx/templates/, see the Dockerfile).
# Behind an HTTPS proxy (Caddy) the visitor's scheme arrives in X-Forwarded-Proto; without one, nginx knows only its own.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API is looked up again every few seconds (a variable in proxy_pass makes nginx use the resolver at request time)
  # instead of once at startup, so redeploying the API, which gives it a new address, does not leave this proxy pointing at the old one.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
  set $api_upstream http://${API_HOST}:8080;

  # The security headers, as variables: nginx does NOT inherit add_header from this level into any location block
  # that sets its own add_header (its documented, easy-to-miss behaviour), and every location below already has one
  # of its own (for Cache-Control). Rather than repeat the literal header strings in each location and risk them
  # drifting apart, each location repeats the (short) add_header lines but reads the value from here, once.
  # Fonts, images and application data are same-origin. Razorpay checkout is the exception: allow its script,
  # payment frame and API explicitly, without allowing arbitrary third-party scripts or frames.
  # 'unsafe-inline' stays on script-src and style-src because the public
  # pages and index.html's theme-detection run from inline <script>/<style> blocks, not external files; everything
  # else is locked to 'self', which still blocks an attacker's injected <script src="https://evil...*">  or a framed
  # embed, the two things that matter most without a CSP at all.
  set $sec_csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://www.facebook.com https://connect.facebook.net; frame-src https://api.razorpay.com https://checkout.razorpay.com https://www.facebook.com https://web.facebook.com; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
  set $sec_permissions "camera=(), microphone=(), geolocation=()";
  set $sec_hsts "max-age=31536000; includeSubDomains";

  # Same origin for UI and API keeps the HttpOnly refresh cookie first-party (SameSite=Strict).
  location /api/ {
    proxy_pass $api_upstream;
    client_max_body_size 520m;   # the API enforces the real per-plan limit
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # The AI assistant streams its answers as they are written, so nothing is buffered, deep reasoning may take a few minutes, and
  # attached pictures and documents (up to the limits the API enforces) are let through.
  location /api/v1/ai/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    client_max_body_size 40m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Live chat: a long-lived WebSocket (falls back to long polling), so no buffering and a long read timeout.
  location /hubs/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /health {
    proxy_pass $api_upstream;
  }

  # SCIM 2.0 provisioning (identity providers call {site}/scim/v2/...).
  location /scim/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Fingerprinted build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy $sec_permissions always;
    add_header Strict-Transport-Security $sec_hsts always;
    add_header Content-Security-Policy $sec_csp always;
    try_files $uri =404;
  }

  # Which build the server has now: open tabs compare it with their own to offer a reload after a release, so it is never cached.
  location = /version.json {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy $sec_permissions always;
    add_header Strict-Transport-Security $sec_hsts always;
    add_header Content-Security-Policy $sec_csp always;
    try_files $uri =404;
  }

  # The public pages are files of their own (/features/, /features/portfolio/, /pricing/, /security/): one address each, with the trailing slash.
  location ~ ^/(features/[a-z-]+|solutions/[a-z-]+|features|pricing|security|download|delete-account)$ {
    return 301 /$1/;
  }

  # Addresses from the first version of the site that search engines still remember: sign-in and sign-up move to their
  # current pages for good, every other "?action=" goes home, and the old unversioned API is gone (410 tells crawlers to drop it).
  location ~ ^/api/(?!v1/) {
    return 410;
  }

  # Connected apps (Claude, ChatGPT and other MCP clients): the OAuth server and its discovery documents live in the API.
  location ^~ /oauth/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
  location ^~ /.well-known/oauth- {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
  location = /.well-known/openid-configuration {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # The one dotfile that is real and meant to be public (RFC 9116). A "^~" prefix match is checked before any
  # regex location regardless of file order, so this always wins over the blanket dotfile block right below it.
  location ^~ /.well-known/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Every other dotfile (.env, .git/config and the like) is never a real file here - the SPA fallback below would
  # otherwise hand them index.html with a 200, which a scanner reasonably flags as worth a second look even though
  # nothing is actually exposed. A direct, explicit 404 is the honest answer for a path that was never going to exist.
  location ~ /\. {
    return 404;
  }

  # The brand files and the search-engine files change rarely and are fetched by crawlers: a day of caching is plenty.
  location ~ ^/(favicon\.ico|favicon\.svg|favicon-48x48\.png|og-image\.png|robots\.txt|sitemap\.xml)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy $sec_permissions always;
    add_header Strict-Transport-Security $sec_hsts always;
    add_header Content-Security-Policy $sec_csp always;
    try_files $uri =404;
  }

  location = / {
    if ($arg_action = "login") { return 301 /login; }
    if ($arg_action = "register") { return 301 /register; }
    if ($arg_action != "") { return 301 /; }
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy $sec_permissions always;
    add_header Strict-Transport-Security $sec_hsts always;
    add_header Content-Security-Policy $sec_csp always;
    try_files /index.html =404;
  }

  # Single-page app fallback. A directory with its own index.html (the public pages) is served as that page.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy $sec_permissions always;
    add_header Strict-Transport-Security $sec_hsts always;
    add_header Content-Security-Policy $sec_csp always;
    try_files $uri $uri/index.html /index.html;
  }
}
